name: Release Workflow

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.1.0 or 1.0.0)'
        required: true
        default: '0.1.0'

permissions:
  contents: write

env:
  NODE_VERSION: '22'
  RELEASE_VERSION: ${{ github.event.inputs.version || '0.1.0' }}

jobs:
  setup:
    name: Setup Dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

  lint:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    needs: setup
    continue-on-error: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run ESLint
        run: npm run lint || true

      - name: Run TypeScript typecheck
        run: npx tsc --noEmit

  build:
    name: Next.js Standalone Build
    runs-on: ubuntu-latest
    needs: [setup, lint]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build Next.js Application
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production
        run: npm run build

      - name: Upload Standalone Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-standalone-build
          path: |
            .next/standalone
            .next/static
            public
          retention-days: 7

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version format
        run: |
          if [[ ! "${RELEASE_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version format '${RELEASE_VERSION}'. Use SemVer X.Y.Z (e.g. 0.1.0)"
            exit 1
          fi

      - name: Check for existing tag
        id: check_tag
        run: |
          if git rev-parse "v${RELEASE_VERSION}" >/dev/null 2>&1; then
            echo "ERROR: Tag v${RELEASE_VERSION} already exists. Aborting release."
            exit 1
          fi

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: nextjs-standalone-build
          path: build-artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.RELEASE_VERSION }}
          name: Release v${{ env.RELEASE_VERSION }} - MVP
          generate_release_notes: true
          body: |
            ## 🚀 GitHub Stats & Performance Tier Card - MVP Release v${{ env.RELEASE_VERSION }}

            ### Highlights
            - **GitHub Stats API Route** (`/api/stats`): Ingests followers, public repos, stargazers count, and active 90-day contributions.
            - **Performance Tiers**: Algorithmic scoring evaluating Bronze, Gold, and Mythic developer ranks.
            - **Custom Card Builder & 8 City Themes**: Handcrafted palettes for Tokyo, Berlin, Bangalore, Hyderabad, SF, Paris, Frankfurt, and Shanghai.
            - **Modular Aesthetics**: Configurable avatar frames, badges, background textures, and persistent URL sharing.
            - **Mobile-First Design**: Optimized layout, touch targets, and typography for mobile and desktop screens.
            - **Retina PNG Export**: One-click 3x retina card export via `html-to-image` with CORS handling.
            - **Docker & Render Ready**: Multi-stage standalone Node 22 Alpine container and Render Blueprint `render.yaml`.
          draft: false
          prerelease: false

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: [build, release]
    if: |
      always() &&
      needs.build.result == 'success' &&
      (needs.release.result == 'success' || needs.release.result == 'skipped') &&
      github.ref == 'refs/heads/main'

    steps:
      - name: Trigger Render Deploy Hook
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK }}" ]; then
            echo "RENDER_DEPLOY_HOOK is not set in GitHub repository secrets."
            echo "To enable automated deployment, add RENDER_DEPLOY_HOOK in Settings -> Secrets and variables -> Actions."
            exit 0
          fi
          echo "Triggering Render deployment webhook..."
          curl -f -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
          echo "Deployment hook successfully dispatched to Render."

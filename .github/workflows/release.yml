name: Release Workflow

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version matching package.json (leave blank to use the package version)'
        required: false
        type: string

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  build:
    name: Next.js Standalone Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run comparison tests
        run: npm test

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build Next.js Application
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production
        run: npm run build

      - name: Upload Standalone Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-standalone-build
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .next/standalone
            .next/static
            public
            !**/.env*
          retention-days: 7

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Validate release version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          package_version=$(node -p "require('./package.json').version")
          lock_version=$(node -p "require('./package-lock.json').version")
          version="${REQUESTED_VERSION:-$package_version}"

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Use a version in X.Y.Z format."
            exit 1
          fi
          if [[ "$version" != "$package_version" || "$version" != "$lock_version" ]]; then
            echo "::error::The release version must match package.json and package-lock.json."
            exit 1
          fi
          if ! grep -Fq "## [$version]" CHANGELOG.md; then
            echo "::error::Add a changelog entry for the release version."
            exit 1
          fi
          if git show-ref --verify --quiet "refs/tags/v$version"; then
            echo "::error::Tag v$version already exists."
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Extract release notes
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: node scripts/extract-changelog.mjs "$RELEASE_VERSION"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          target_commitish: ${{ github.sha }}
          name: Release v${{ steps.version.outputs.value }}
          body_path: release_notes.md
          generate_release_notes: false
          draft: false
          prerelease: false

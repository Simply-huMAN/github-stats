name: Feature Snapshot CI

on:
  push:
    branches: [ working, feature/*, dev ]
  pull_request:
  workflow_dispatch:

env:
  NODE_VERSION: '22'

jobs:
  setup:
    name: Setup Dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

  lint:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    needs: setup
    continue-on-error: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run ESLint
        run: npm run lint || true

      - name: Run TypeScript typecheck
        run: npx tsc --noEmit

  build:
    name: Build Snapshot
    runs-on: ubuntu-latest
    needs: [setup, lint]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build Next.js Application
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production
        run: npm run build

      - name: Upload Snapshot Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-snapshot-build
          path: |
            .next/standalone
            .next/static
            public
          retention-days: 3


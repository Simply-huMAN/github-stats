name: Feature Snapshot CI

on:
  push:
    branches: [working, 'feature/*', dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  build:
    name: Build Snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run comparison tests
        run: npm test

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build Next.js Application
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production
        run: npm run build

      - name: Upload Standalone Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-snapshot-build
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .next/standalone
            .next/static
            public
            !**/.env*
          retention-days: 3

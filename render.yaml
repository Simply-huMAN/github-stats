# Render Infrastructure as Code Blueprint
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: github-stats
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    autoDeploy: true
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: HOSTNAME
        value: 0.0.0.0
      - key: GITHUB_TOKEN
        sync: false # Set securely in Render dashboard to elevate rate limit to 5,000 req/hr
